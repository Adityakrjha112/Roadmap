<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
<title id="title">Specificity is one step, not the whole story</title><desc id="desc">Five cascade decisions: relevance; origin importance and layers; specificity; scoping proximity; source order.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#243d32" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="800" height="460" rx="20" fill="#f9f9f3" stroke="none"/><text x="32" y="45" font-family="Arial, sans-serif" font-size="23" fill="#243d32" font-weight="600">Specificity is one step, not the whole story</text><rect x="32" y="78" width="736" height="60" rx="8" fill="#d9e9d4" stroke="none"/><text x="48" y="114" font-family="Arial, sans-serif" font-size="18" fill="#5b6b60" font-weight="400">01</text><text x="95" y="103" font-family="Arial, sans-serif" font-size="18" fill="#243d32" font-weight="600">Does the rule apply?</text><text x="95" y="125" font-family="Arial, sans-serif" font-size="14" fill="#5b6b60" font-weight="400">Selector and conditions match.</text><rect x="32" y="150" width="736" height="60" rx="8" fill="#eef1e7" stroke="none"/><text x="48" y="186" font-family="Arial, sans-serif" font-size="18" fill="#5b6b60" font-weight="400">02</text><text x="95" y="175" font-family="Arial, sans-serif" font-size="18" fill="#243d32" font-weight="600">Which priority group?</text><text x="95" y="197" font-family="Arial, sans-serif" font-size="14" fill="#5b6b60" font-weight="400">Origin, importance, and layers.</text><rect x="32" y="222" width="736" height="60" rx="8" fill="#d9e9d4" stroke="none"/><text x="48" y="258" font-family="Arial, sans-serif" font-size="18" fill="#5b6b60" font-weight="400">03</text><text x="95" y="247" font-family="Arial, sans-serif" font-size="18" fill="#243d32" font-weight="600">Which selector is more specific?</text><text x="95" y="269" font-family="Arial, sans-serif" font-size="14" fill="#5b6b60" font-weight="400">IDs → classes / attributes → types.</text><rect x="32" y="294" width="736" height="60" rx="8" fill="#eef1e7" stroke="none"/><text x="48" y="330" font-family="Arial, sans-serif" font-size="18" fill="#5b6b60" font-weight="400">04</text><text x="95" y="319" font-family="Arial, sans-serif" font-size="18" fill="#243d32" font-weight="600">How close is its scope?</text><text x="95" y="341" font-family="Arial, sans-serif" font-size="14" fill="#5b6b60" font-weight="400">Relevant when scoped rules otherwise tie.</text><rect x="32" y="366" width="736" height="60" rx="8" fill="#d9e9d4" stroke="none"/><text x="48" y="402" font-family="Arial, sans-serif" font-size="18" fill="#5b6b60" font-weight="400">05</text><text x="95" y="391" font-family="Arial, sans-serif" font-size="18" fill="#243d32" font-weight="600">Which comes last?</text><text x="95" y="413" font-family="Arial, sans-serif" font-size="14" fill="#5b6b60" font-weight="400">Source order breaks the remaining tie.</text></svg>