<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
<title id="title">Same card. Different spaces.</title><desc id="desc">Two containers within one viewport. A narrow card stacks image and text; a wide card puts them beside each other.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#243d32" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="800" height="460" rx="20" fill="#f9f9f3" stroke="none"/><text x="32" y="45" font-family="Arial, sans-serif" font-size="23" fill="#243d32" font-weight="600">Same card. Different spaces.</text><rect x="32" y="93" width="735" height="309" rx="10" fill="#edf1e7" stroke="none"/><text x="52" y="125" font-family="Arial, sans-serif" font-size="17" fill="#243d32" font-weight="600">ONE VIEWPORT · two different container widths</text><rect x="53" y="151" width="220" height="230" rx="8" fill="#ffffff" stroke="none"/><rect x="70" y="168" width="185" height="84" rx="5" fill="#d9e9d4" stroke="none"/><text x="71" y="285" font-family="Arial, sans-serif" font-size="20" fill="#243d32" font-weight="600">Narrow slot</text><text x="71" y="318" font-family="Arial, sans-serif" font-size="16" fill="#243d32" font-weight="400">Stack the content.</text><rect x="295" y="151" width="450" height="230" rx="8" fill="#ffffff" stroke="none"/><rect x="315" y="174" width="160" height="180" rx="5" fill="#d9e9d4" stroke="none"/><text x="498" y="230" font-family="Arial, sans-serif" font-size="20" fill="#243d32" font-weight="600">Wide slot</text><text x="498" y="265" font-family="Arial, sans-serif" font-size="16" fill="#243d32" font-weight="400">Place content</text><text x="498" y="289" font-family="Arial, sans-serif" font-size="16" fill="#243d32" font-weight="400">side by side.</text><text x="45" y="439" font-family="Arial, sans-serif" font-size="17" fill="#243d32" font-weight="400">@container responds to an ancestor; @media responds to the viewport.</text></svg>