<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
<title id="title">Same content. Different flow.</title><desc id="desc">Block items occupy separate lines. Inline items fit their text. Inline-block items share a line but accept a width.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#243d32" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="800" height="460" rx="20" fill="#f9f9f3" stroke="none"/><text x="32" y="45" font-family="Arial, sans-serif" font-size="23" fill="#243d32" font-weight="600">Same content. Different flow.</text><text x="32" y="85" font-family="Arial, sans-serif" font-size="20" fill="#243d32" font-weight="600">block</text><text x="210" y="85" font-family="Arial, sans-serif" font-size="16" fill="#243d32" font-weight="400">A new line; auto width usually fills it.</text><rect x="210" y="101" width="554" height="66" rx="6" fill="#eaf0e5" stroke="none"/><rect x="222" y="108" width="530" height="23" rx="4" fill="#d9e9d4" stroke="none"/><rect x="222" y="137" width="530" height="23" rx="4" fill="#f4c7a2" stroke="none"/><text x="234" y="125" font-family="Arial, sans-serif" font-size="14" fill="#243d32" font-weight="400">A</text><text x="234" y="154" font-family="Arial, sans-serif" font-size="14" fill="#243d32" font-weight="400">B</text><text x="32" y="199" font-family="Arial, sans-serif" font-size="20" fill="#243d32" font-weight="600">inline</text><text x="210" y="199" font-family="Arial, sans-serif" font-size="16" fill="#243d32" font-weight="400">Part of a text line; width does not size a span.</text><rect x="210" y="215" width="554" height="66" rx="6" fill="#eaf0e5" stroke="none"/><rect x="222" y="227" width="68" height="37" rx="4" fill="#d9e9d4" stroke="none"/><text x="236" y="251" font-family="Arial, sans-serif" font-size="18" fill="#243d32" font-weight="400">A</text><rect x="302" y="227" width="68" height="37" rx="4" fill="#f4c7a2" stroke="none"/><text x="316" y="251" font-family="Arial, sans-serif" font-size="18" fill="#243d32" font-weight="400">B</text><text x="32" y="313" font-family="Arial, sans-serif" font-size="20" fill="#243d32" font-weight="600">inline-block</text><text x="210" y="313" font-family="Arial, sans-serif" font-size="16" fill="#243d32" font-weight="400">An inline box that accepts width and height.</text><rect x="210" y="329" width="554" height="66" rx="6" fill="#eaf0e5" stroke="none"/><rect x="222" y="341" width="160" height="37" rx="4" fill="#d9e9d4" stroke="none"/><text x="236" y="365" font-family="Arial, sans-serif" font-size="18" fill="#243d32" font-weight="400">A</text><rect x="394" y="341" width="160" height="37" rx="4" fill="#f4c7a2" stroke="none"/><text x="408" y="365" font-family="Arial, sans-serif" font-size="18" fill="#243d32" font-weight="400">B</text></svg>