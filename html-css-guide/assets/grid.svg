<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
<title id="title">A layout you can sketch first</title><desc id="desc">A two-row three-column grid, with each cell labelled by row and column. Gaps separate tracks.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#243d32" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="800" height="460" rx="20" fill="#f9f9f3" stroke="none"/><text x="32" y="45" font-family="Arial, sans-serif" font-size="23" fill="#243d32" font-weight="600">A layout you can sketch first</text><text x="34" y="85" font-family="Arial, sans-serif" font-size="18" fill="#5b6b60" font-weight="400">Rows + columns + intentional gaps</text><text x="160" y="118" font-family="Arial, sans-serif" font-size="16" fill="#5b6b60" font-weight="400">Column 1</text><text x="365" y="118" font-family="Arial, sans-serif" font-size="16" fill="#5b6b60" font-weight="400">Column 2</text><text x="570" y="118" font-family="Arial, sans-serif" font-size="16" fill="#5b6b60" font-weight="400">Column 3</text><text x="32" y="202" font-family="Arial, sans-serif" font-size="15" fill="#5b6b60" font-weight="400">Row 1</text><rect x="135" y="140" width="180" height="105" rx="8" fill="#d9e9d4" stroke="none"/><text x="183" y="200" font-family="Arial, sans-serif" font-size="20" fill="#243d32" font-weight="600">1 / 1</text><rect x="340" y="140" width="180" height="105" rx="8" fill="#f4c7a2" stroke="none"/><text x="388" y="200" font-family="Arial, sans-serif" font-size="20" fill="#243d32" font-weight="600">1 / 2</text><rect x="545" y="140" width="180" height="105" rx="8" fill="#d9e7ef" stroke="none"/><text x="593" y="200" font-family="Arial, sans-serif" font-size="20" fill="#243d32" font-weight="600">1 / 3</text><text x="32" y="327" font-family="Arial, sans-serif" font-size="15" fill="#5b6b60" font-weight="400">Row 2</text><rect x="135" y="265" width="180" height="105" rx="8" fill="#d9e9d4" stroke="none"/><text x="183" y="325" font-family="Arial, sans-serif" font-size="20" fill="#243d32" font-weight="600">2 / 1</text><rect x="340" y="265" width="180" height="105" rx="8" fill="#f4c7a2" stroke="none"/><text x="388" y="325" font-family="Arial, sans-serif" font-size="20" fill="#243d32" font-weight="600">2 / 2</text><rect x="545" y="265" width="180" height="105" rx="8" fill="#d9e7ef" stroke="none"/><text x="593" y="325" font-family="Arial, sans-serif" font-size="20" fill="#243d32" font-weight="600">2 / 3</text><text x="135" y="414" font-family="Arial, sans-serif" font-size="17" fill="#243d32" font-weight="400">A track is a row or column. A cell is one intersection.</text></svg>