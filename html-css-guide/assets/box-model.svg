<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
<title id="title">Meet the four layers of a box</title><desc id="desc">From outside to inside: orange margin, dark border, green padding, blue content. Border-box includes content, padding and border but not margin.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#243d32" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="800" height="460" rx="20" fill="#f9f9f3" stroke="none"/><text x="32" y="45" font-family="Arial, sans-serif" font-size="23" fill="#243d32" font-weight="600">Meet the four layers of a box</text><rect x="95" y="80" width="610" height="335" rx="10" fill="#f4c7a2" stroke="none"/><text x="115" y="108" font-family="Arial, sans-serif" font-size="16" fill="#243d32" font-weight="600">MARGIN · outside space</text><rect x="140" y="125" width="520" height="245" rx="4" fill="#243d32" stroke="none"/><text x="158" y="152" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="600">BORDER · the edge</text><rect x="150" y="165" width="500" height="195" rx="0" fill="#d9e9d4" stroke="none"/><text x="170" y="193" font-family="Arial, sans-serif" font-size="16" fill="#243d32" font-weight="600">PADDING · breathing room</text><rect x="217" y="215" width="366" height="95" rx="4" fill="#d9e7ef" stroke="none"/><text x="303" y="270" font-family="Arial, sans-serif" font-size="24" fill="#243d32" font-weight="600">CONTENT</text><text x="180" y="445" font-family="Arial, sans-serif" font-size="18" fill="#243d32" font-weight="400">border-box width = content + padding + border</text></svg>