<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
<title id="title">Five ways to place a box</title><desc id="desc">Comparison of static, relative, absolute, fixed and sticky positioning. Fixed containing blocks can be changed by certain ancestors.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#243d32" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="800" height="460" rx="20" fill="#f9f9f3" stroke="none"/><text x="32" y="45" font-family="Arial, sans-serif" font-size="23" fill="#243d32" font-weight="600">Five ways to place a box</text><rect x="32" y="80" width="736" height="59" rx="6" fill="#eef1e7" stroke="none"/><text x="49" y="104" font-family="Arial, sans-serif" font-size="18" fill="#243d32" font-weight="600">static</text><text x="49" y="125" font-family="Arial, sans-serif" font-size="14" fill="#5b6b60" font-weight="400">Normal flow; offsets do not reposition it.</text><rect x="596" y="98" width="35" height="24" rx="3" fill="#d9e9d4" stroke="none"/><rect x="644" y="98" width="35" height="24" rx="3" fill="#f4c7a2" stroke="none"/><rect x="692" y="98" width="35" height="24" rx="3" fill="#d9e9d4" stroke="none"/><rect x="32" y="150" width="736" height="59" rx="6" fill="#eef1e7" stroke="none"/><text x="49" y="174" font-family="Arial, sans-serif" font-size="18" fill="#243d32" font-weight="600">relative</text><text x="49" y="195" font-family="Arial, sans-serif" font-size="14" fill="#5b6b60" font-weight="400">Keeps its space; its visual box can move.</text><rect x="596" y="168" width="35" height="24" rx="3" fill="#d9e9d4" stroke="none"/><rect x="644" y="168" width="35" height="24" rx="3" fill="#f4c7a2" stroke="none"/><rect x="692" y="168" width="35" height="24" rx="3" fill="#d9e9d4" stroke="none"/><rect x="650" y="156" width="35" height="24" rx="3" fill="#243d32" stroke="none"/><rect x="32" y="220" width="736" height="59" rx="6" fill="#eef1e7" stroke="none"/><text x="49" y="244" font-family="Arial, sans-serif" font-size="18" fill="#243d32" font-weight="600">absolute</text><text x="49" y="265" font-family="Arial, sans-serif" font-size="14" fill="#5b6b60" font-weight="400">Out of flow; placed inside its containing block.</text><rect x="596" y="238" width="35" height="24" rx="3" fill="#d9e9d4" stroke="none"/><rect x="644" y="238" width="35" height="24" rx="3" fill="#f4c7a2" stroke="none"/><rect x="692" y="238" width="35" height="24" rx="3" fill="#d9e9d4" stroke="none"/><rect x="650" y="226" width="35" height="24" rx="3" fill="#243d32" stroke="none"/><rect x="32" y="290" width="736" height="59" rx="6" fill="#eef1e7" stroke="none"/><text x="49" y="314" font-family="Arial, sans-serif" font-size="18" fill="#243d32" font-weight="600">fixed</text><text x="49" y="335" font-family="Arial, sans-serif" font-size="14" fill="#5b6b60" font-weight="400">Out of flow; often pinned to the viewport.</text><rect x="596" y="308" width="35" height="24" rx="3" fill="#d9e9d4" stroke="none"/><rect x="644" y="308" width="35" height="24" rx="3" fill="#f4c7a2" stroke="none"/><rect x="692" y="308" width="35" height="24" rx="3" fill="#d9e9d4" stroke="none"/><rect x="32" y="360" width="736" height="59" rx="6" fill="#eef1e7" stroke="none"/><text x="49" y="384" font-family="Arial, sans-serif" font-size="18" fill="#243d32" font-weight="600">sticky</text><text x="49" y="405" font-family="Arial, sans-serif" font-size="14" fill="#5b6b60" font-weight="400">In flow; sticks within scroll and container limits.</text><rect x="596" y="378" width="35" height="24" rx="3" fill="#d9e9d4" stroke="none"/><rect x="644" y="378" width="35" height="24" rx="3" fill="#f4c7a2" stroke="none"/><rect x="692" y="378" width="35" height="24" rx="3" fill="#d9e9d4" stroke="none"/></svg>