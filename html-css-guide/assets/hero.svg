<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
<title id="title">Small ideas. Real things you can build.</title><desc id="desc">A diagram of an HTML browser page alongside a CSS rule card, illustrating structure, style and layout.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#243d32" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="800" height="460" rx="20" fill="#f9f9f3" stroke="none"/><text x="32" y="45" font-family="Arial, sans-serif" font-size="23" fill="#243d32" font-weight="600">Small ideas. Real things you can build.</text><rect x="25" y="75" width="750" height="355" rx="16" fill="#edf2e5" stroke="none"/><text x="55" y="115" font-family="Arial, sans-serif" font-size="14" fill="#5b6b60" font-weight="600">STRUCTURE → STYLE → LAYOUT</text><rect x="73" y="159" width="326" height="224" rx="14" fill="#ffffff" stroke="#c7d5c3"/><rect x="73" y="159" width="326" height="36" rx="14" fill="#243d32" stroke="none"/><text x="91" y="183" font-family="Arial, sans-serif" font-size="13" fill="#ffffff" font-weight="400">your-first-page.html</text><text x="96" y="240" font-family="Arial, sans-serif" font-size="32" fill="#243d32" font-weight="600">Hello, web.</text><rect x="97" y="262" width="204" height="8" rx="4" fill="#d9e9d4" stroke="none"/><rect x="97" y="281" width="257" height="8" rx="4" fill="#d9e9d4" stroke="none"/><rect x="97" y="317" width="114" height="35" rx="6" fill="#f4c7a2" stroke="none"/><text x="112" y="340" font-family="Arial, sans-serif" font-size="16" fill="#243d32" font-weight="400">Explore →</text><rect x="425" y="127" width="307" height="199" rx="14" fill="#d9e9d4" stroke="#bdcfb8"/><text x="449" y="164" font-family="Arial, sans-serif" font-size="17" fill="#243d32" font-weight="600">.a-little-curiosity {</text><text x="465" y="206" font-family="Arial, sans-serif" font-size="18" fill="#243d32" font-weight="400">display: grid;</text><text x="465" y="242" font-family="Arial, sans-serif" font-size="18" fill="#243d32" font-weight="400">gap: 1rem;</text><text x="449" y="283" font-family="Arial, sans-serif" font-size="18" fill="#243d32" font-weight="400">}</text><rect x="502" y="346" width="182" height="55" rx="28" fill="#f4c7a2" stroke="none"/><text x="523" y="381" font-family="Arial, sans-serif" font-size="14" fill="#243d32" font-weight="600">Made to make sense.</text></svg>