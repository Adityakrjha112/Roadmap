<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
<title id="title">Flexbox follows axes, not screen directions</title><desc id="desc">For a horizontal row, the main axis runs left to right and the cross axis runs top to bottom. justify-content uses the main axis; align-items uses the cross axis.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#243d32" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="800" height="460" rx="20" fill="#f9f9f3" stroke="none"/><text x="32" y="45" font-family="Arial, sans-serif" font-size="23" fill="#243d32" font-weight="600">Flexbox follows axes, not screen directions</text><text x="34" y="82" font-family="Arial, sans-serif" font-size="17" fill="#5b6b60" font-weight="400">flex-direction: row · horizontal writing mode</text><rect x="70" y="130" width="660" height="210" rx="9" fill="#eaf0e5" stroke="none"/><rect x="100" y="185" width="125" height="100" rx="8" fill="#d9e9d4" stroke="none"/><text x="120" y="244" font-family="Arial, sans-serif" font-size="20" fill="#243d32" font-weight="600">Item 1</text><rect x="280" y="185" width="160" height="100" rx="8" fill="#f4c7a2" stroke="none"/><text x="300" y="244" font-family="Arial, sans-serif" font-size="20" fill="#243d32" font-weight="600">Item 2</text><rect x="495" y="185" width="125" height="100" rx="8" fill="#d9e7ef" stroke="none"/><text x="515" y="244" font-family="Arial, sans-serif" font-size="20" fill="#243d32" font-weight="600">Item 3</text><path d="M75 110 L725 110" fill="none" stroke="#243d32" stroke-width="2" marker-end="url(#arrow)"/><text x="245" y="101" font-family="Arial, sans-serif" font-size="16" fill="#243d32" font-weight="600">MAIN AXIS · justify-content</text><path d="M48 135 L48 340" fill="none" stroke="#243d32" stroke-width="2" marker-end="url(#arrow)"/><text x="77" y="376" font-family="Arial, sans-serif" font-size="17" fill="#243d32" font-weight="600">CROSS AXIS · align-items (vertical here)</text><text x="77" y="417" font-family="Arial, sans-serif" font-size="17" fill="#5b6b60" font-weight="400">Switch to column and the axes switch roles.</text></svg>