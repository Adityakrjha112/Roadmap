<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="title desc">
<title id="title">The content stays. The arrangement adapts.</title><desc id="desc">A wide dashboard has a sidebar and two card columns. A narrow phone layout stacks the same content in one column.</desc>
